# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - ".github/workflows/static.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: 產生部署版本檔並輸出時間診斷
        env:
          TZ: Asia/Taipei
        run: |
          TAIPEI_TIME="$(date '+%y%m%d,%H:%M:%S')"
          UTC_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          RUN_ID="${GITHUB_RUN_ID}"
          RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}"
          COMMIT_SHA="${GITHUB_SHA}"
          VERSION="${TAIPEI_TIME}-r${RUN_ID}a${RUN_ATTEMPT}"

          printf '{\n  "version": "%s",\n  "taipei_time": "%s",\n  "utc_time": "%s",\n  "run_id": "%s",\n  "run_attempt": "%s",\n  "commit_sha": "%s"\n}\n' \
            "$VERSION" "$TAIPEI_TIME" "$UTC_TIME" "$RUN_ID" "$RUN_ATTEMPT" "$COMMIT_SHA" > src/version.json
          printf "window.__DIANGARDEN_BUILD_VERSION__ = '%s';\n" "$VERSION" > src/build-version.js

          echo "Version diagnostic:"
          echo "  Taiwan time: $TAIPEI_TIME (Asia/Taipei)"
          echo "  UTC time: $UTC_TIME"
          echo "  Version written: $VERSION"
          echo "  GitHub run ID: $RUN_ID"
          echo "  GitHub run attempt: $RUN_ATTEMPT"
          echo "  Commit SHA: $COMMIT_SHA"
          echo "  version.json content:"
          cat src/version.json
      - name: 準備花卉像素圖資產
        run: mkdir -p src/assets/flowers && cp assets/flowers/*.png src/assets/flowers/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the website files from src/ as the site root.
          path: "./src"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
