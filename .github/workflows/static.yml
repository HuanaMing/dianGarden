# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "assets/btn/**"
      - "assets/無人機翅膀.png"
      - ".github/workflows/static.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: 產生每日更新序號與版本檔
        env:
          TZ: Asia/Taipei
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIPEI_DATE="$(date '+%y%m%d')"
          UTC_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          RUN_ID="${GITHUB_RUN_ID}"
          COMMIT_SHA="${GITHUB_SHA}"
          MIDNIGHT_UTC="$(TZ=Asia/Taipei date -d 'today 00:00:00' -u '+%Y-%m-%dT%H:%M:%SZ')"

          # Count successful deployments earlier today in Taipei time.
          # Exclude this run; the current deployment receives the next number.
          SUCCESSFUL_TODAY=0
          PAGE=1
          while :; do
            RUNS_JSON="$(curl --fail-with-body --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100&page=${PAGE}&created=%3E%3D${MIDNIGHT_UTC}")"
            PAGE_COUNT="$(printf '%s' "$RUNS_JSON" | jq '.workflow_runs | length')"
            [ "$PAGE_COUNT" -gt 0 ] || break

            while IFS= read -r CREATED_AT; do
              [ -n "$CREATED_AT" ] || continue
              RUN_DATE="$(date -d "$CREATED_AT" '+%y%m%d')"
              if [ "$RUN_DATE" = "$TAIPEI_DATE" ]; then
                SUCCESSFUL_TODAY=$((SUCCESSFUL_TODAY + 1))
              fi
            done < <(printf '%s' "$RUNS_JSON" | jq -r --arg current "$RUN_ID" '.workflow_runs[] | select(.workflow_id == 391530417 and (.id | tostring) != $current and .status == "completed" and .conclusion == "success") | .created_at')

            [ "$PAGE_COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          UPDATE_NUMBER="$(printf '%03d' "$((SUCCESSFUL_TODAY + 1))")"
          VERSION="${TAIPEI_DATE}, ${UPDATE_NUMBER}"

          printf '{\n  "version": "%s",\n  "taipei_date": "%s",\n  "daily_update_number": %s,\n  "utc_time": "%s",\n  "run_id": "%s",\n  "commit_sha": "%s"\n}\n' \
            "$VERSION" "$TAIPEI_DATE" "$((SUCCESSFUL_TODAY + 1))" "$UTC_TIME" "$RUN_ID" "$COMMIT_SHA" > src/version.json
          printf "window.__DIANGARDEN_BUILD_VERSION__ = '%s';\n" "$VERSION" > src/build-version.js

          echo "Version diagnostic:"
          echo "  Taiwan date: $TAIPEI_DATE (Asia/Taipei)"
          echo "  UTC time: $UTC_TIME"
          echo "  Previous successful deployments today: $SUCCESSFUL_TODAY"
          echo "  Daily update number: $((SUCCESSFUL_TODAY + 1))"
          echo "  Version written: $VERSION"
          echo "  GitHub run ID: $RUN_ID"
          echo "  Commit SHA: $COMMIT_SHA"
          echo "  version.json content:"
          cat src/version.json
      - name: 為靜態資源加入部署版本參數
        run: python3 scripts/version-assets.py src/index.html src/version.json

      - name: 準備遊戲圖片資產
        run: mkdir -p src/assets/flowers src/assets/btn && cp assets/flowers/*.png src/assets/flowers/ && cp assets/wreath.webp src/assets/wreath.webp && cp assets/無人機翅膀.png src/assets/無人機翅膀.png && cp assets/btn/*.png src/assets/btn/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the website files from src/ as the site root.
          path: "./src"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
