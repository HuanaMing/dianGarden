name: Browser smoke tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "assets/**"
      - "tests/**"
      - "scripts/version-assets.py"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Prepare the Pages-like static site
        run: |
          mkdir -p src/assets/flowers src/assets/btn
          cp assets/flowers/*.png src/assets/flowers/
          cp assets/wreath.webp src/assets/wreath.webp
          cp assets/btn/*.png src/assets/btn/
          printf '{"version":"261024, 999","taipei_date":"261024","daily_update_number":999}\n' > src/version.json
          printf "window.__DIANGARDEN_BUILD_VERSION__ = '261024, 999';\n" > src/build-version.js
          python3 scripts/version-assets.py src/index.html src/version.json

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory src > /tmp/dian-garden-http.log 2>&1 &
          echo $! > /tmp/dian-garden-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dian-garden-http.log
          exit 1

      - name: Run Playwright browser smoke tests
        env:
          GARDEN_TEST_URL: http://127.0.0.1:4173
        run: node tests/browser-smoke.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: test-results/screenshots/
          if-no-files-found: warn
