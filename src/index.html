<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#dff3ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>花明摸魚花園</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="world-section" aria-label="空中農場 3D 場景">
        <div class="world-frame">
          <canvas id="sky-canvas" aria-label="可用滑鼠與鍵盤探索並選取土地的空中農場 3D 場景"></canvas>
          <header class="world-topbar" id="world-topbar">
            <div class="world-brand"><span id="garden-avatar" aria-label="花園頭像" aria-hidden="false">🌼</span><h1><button class="garden-name-display" id="garden-name-display" type="button" aria-label="編輯花園名稱">花明摸魚花園</button></h1><form class="garden-name-editor" id="garden-name-editor" hidden><input id="garden-name-input" type="text" maxlength="24" aria-label="花園名稱" autocomplete="off" required></form></div>
            <div class="world-status">
              <span class="world-wallet" aria-live="polite">🪙 <strong id="coins">120</strong><span>金幣</span></span>
              
              <span class="environment-status" id="environment-status" aria-live="polite">晴朗 · 白天</span>
            </div>
          <div class="topbar-actions" role="group" aria-label="花園控制">
              <button class="farm-management-toggle" id="farm-management-toggle" type="button" aria-controls="farm-management-panel" aria-expanded="false" aria-label="農地管理" title="農地管理">🌱</button>
              <button class="drone-panel-toggle" id="drone-panel-toggle" type="button" aria-controls="drone-jobs" aria-expanded="false" aria-label="無人機">🚁</button>
              <button class="settings-toggle" id="settings-toggle" type="button" aria-controls="settings-panel" aria-expanded="false" aria-label="設定">⚙️</button>
              <a class="encyclopedia-link" href="encyclopedia.html" aria-label="花卉圖鑑" title="花卉圖鑑">📖</a>
              <button class="hud-toggle" id="hud-toggle" type="button" aria-controls="world-topbar drone-jobs plot-selector world-instructions" aria-expanded="true" aria-label="收合介面">🔼</button>
            </div>
          </header>
          <section class="settings-panel" id="settings-panel" aria-label="設定" hidden>
            <h2>設定</h2>
            <section class="avatar-settings" aria-label="自訂頭像">
              <h3>自訂頭像</h3>
              <label for="avatar-mode">頭像來源</label>
              <select id="avatar-mode"><option value="auto">自動（種植最多的花）</option><option value="manual">手動選擇</option></select>
              <div class="avatar-flower-picker" id="avatar-flower-picker">
                <span class="avatar-flower-label">指定花種</span>
                <div class="avatar-flower-options" id="avatar-flower-options" role="group" aria-label="指定花卉頭像"></div>
              </div>
            </section>
            <button class="camera-mode" id="camera-mode" type="button" aria-pressed="false">2D模式</button>
            <button class="reset-progress-button" id="reset-progress" type="button">重置進度</button>
            <button class="power-save-toggle" id="power-save-toggle" type="button" aria-pressed="false">省電模式：關</button>
            <section class="operation-help" aria-label="操作說明">
              <h3>操作說明</h3>
              <p>手機：直接拖曳平移；長按空地半秒後拖曳旋轉，雙指縮放。長按地塊可移動。電腦：拖曳旋轉，WASD 移動，滾輪縮放。</p>
            </section>
            <p class="save-status" id="save-status" role="status" aria-live="polite"></p>
          </section>
          <aside class="drone-jobs" id="drone-jobs" aria-label="無人機工作佇列"><strong id="job-status" role="status" aria-live="polite">無人機待命</strong><button class="auto-mode" id="auto-mode" type="button" aria-pressed="false">自動模式：關</button><button class="buy-drone" id="buy-drone" type="button">購買無人機 · 150 🪙 (1/8)</button><div class="drone-fleet" id="drone-fleet" aria-label="無人機部署管理"></div><ol id="job-queue"></ol></aside>
          <div class="hud-collapsed-summary" id="hud-collapsed-summary" role="status" aria-live="polite"></div>
          <div class="world-message" id="world-message" role="status">正在載入空中島嶼…</div>
          <section class="farm-management-panel" id="farm-management-panel" aria-label="農地管理" hidden>
            <div class="farm-management-heading"><strong>農地管理</strong><button id="farm-management-close" type="button" aria-label="關閉農地管理">×</button></div>
            <nav class="world-plots" id="plot-selector" aria-label="空中農地" role="group"></nav>
            <div class="land-purchase-actions" role="group" aria-label="購買地塊"><button class="world-buy-manual-plot" id="world-buy-manual-plot" type="button" aria-label="購買手動地塊，固定 75 金幣">手動地塊 · 75 🪙</button><button class="world-expand" id="world-expand" type="button" aria-label="購買自動地塊">自動地塊</button></div>
          </section>
          <dialog class="seed-dialog" id="farm-dialog" aria-labelledby="farm-dialog-title">
            <div class="seed-dialog-heading"><div><p class="eyebrow">YOUR SKY GARDEN</p><h2 id="farm-dialog-title">農地</h2></div><button class="dialog-close" type="button" aria-label="關閉操作視窗" data-close-farm-dialog>×</button></div>
            <div class="farm-dialog-content" id="farm-dialog-content"></div>
          </dialog>
          <dialog class="seed-dialog reset-dialog" id="reset-dialog" aria-labelledby="reset-dialog-title">
            <div class="seed-dialog-heading"><div><p class="eyebrow">START OVER</p><h2 id="reset-dialog-title">重置遊戲進度？</h2></div><button class="dialog-close" type="button" aria-label="關閉重置確認" data-cancel-reset>×</button></div>
            <p class="reset-dialog-copy">這會清除金幣、花園名稱、土地與作物、無人機及所有設定，並恢復新遊戲狀態。此操作無法復原。</p>
            <div class="dialog-actions"><button class="dialog-cancel" type="button" data-cancel-reset>保留目前進度</button><button class="reset-confirm-button" id="confirm-reset" type="button">清除並重新開始</button></div>
          </dialog>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <script src="flower-catalog.js"></script>
    <script src="sky-environment.js"></script>
    <script src="model/general.js"></script>
    <script src="model/sun_flower.js"></script>
    <script src="model/hyacinth.js"></script>
    <script src="model/lily_of_the_valley.js"></script>
    <script src="model/rose.js"></script>
    <script src="model/tulip.js"></script>
    <script src="model/carnation.js"></script>
    <script src="model/chrysanthemum.js"></script>
    <script src="model/hydrangea.js"></script>
    <script src="model/lavender.js"></script>
    <script src="model/peony.js"></script>
    <script src="model/higanbana.js"></script>
    <script src="sky-world.js"></script>
    <script src="game.js"></script>
    <script src="version-check.js"></script>
    </body>
</html>
